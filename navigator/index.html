function option(value,label){const o=el('option','',label);o.value=value;return o}
catalog.filter(x=>x.id!==loves).forEach(s=>study.add(option(s.id,s.id===touch?'Who Will Share?':s.title)));
function makeTile(s,i,gridView){
 const b=el('button','tile');b.type='button';b.dataset.index=i;b.title=s.label;b.setAttribute('aria-label','Slide '+(i+1)+'. '+s.label);
 const n=el('span','n',String(i+1)),wrap=el('span'),img=el('img');img.alt='';img.loading='lazy';img.decoding='async';img.src=s.img;
 wrap.append(img,el('span','thumbtxt',s.label));b.append(n,wrap);
 b.onclick=()=>{if(gridView)toggle(false);select(i,true,gridView)};
 return b;
}
function drawDeck(id,i=0){
 deck=byId.get(id)||catalog[0];study.value=deck.id===loves?touch:deck.id;wording.hidden=study.value!==touch;wording.value=deck.id===loves?'loves':'touch';
 slides=[];indices=[];rail.replaceChildren();grid.replaceChildren();$('group').replaceChildren();$('mobileGroup').replaceChildren();
 deck.groups.forEach(g=>{
  indices.push(slides.length);$('group').add(option(String(slides.length),g.title));$('mobileGroup').add(option(String(slides.length),g.title));
  rail.append(el('h3','',g.title));grid.append(el('h3','',g.title));const cards=el('div','cards');grid.append(cards);
  g.slides.forEach(s=>{const k=slides.length;slides.push({...s,group:g.title});rail.append(makeTile(s,k,false));cards.append(makeTile(s,k,true))});
 });
 $('play').href=deck.start;
 select(Math.min(Math.max(0,i),slides.length-1),true);
}
function select(i,scroll=false,focusForward=false){
 const s=slides[i];if(!s)return;pos=i;
 document.querySelectorAll('.tile[aria-current]').forEach(x=>x.removeAttribute('aria-current'));
 document.querySelectorAll('.tile[data-index="'+i+'"]').forEach(x=>x.setAttribute('aria-current','true'));
 $('slide').src=s.img;$('slide').alt=s.label;$('caption').textContent=s.label;$('section').textContent=s.group;
 $('count').textContent=(i+1)+' / '+slides.length;$('back').disabled=i===0;$('forward').disabled=i===slides.length-1;
 const group=indices.filter(v=>v<=i).at(-1);$('group').value=group;$('mobileGroup').value=group;
 const a=$('here');a.href=s.url;a.textContent=s.linkLabel||'Open this slide in the study ↗';a.hidden=s.url===deck.start;
 history.replaceState(null,'','#'+encodeURIComponent(deck.id)+'/'+(i+1));
 if(scroll)rail.querySelector('[aria-current=true]')?.scrollIntoView({block:'nearest'});
 if(focusForward)(i===slides.length-1?$('back'):$('forward')).focus({preventScroll:true});
}
function toggle(on){overview=on;$('stage').hidden=on;grid.hidden=!on;$('overview').setAttribute('aria-pressed',String(on));$('overview').textContent=on?'Slide view':'Overview';if(on)grid.querySelector('[aria-current=true]')?.scrollIntoView({block:'nearest'})}
function jump(i){toggle(false);select(i,true)}
function openHash(){const [id,n]=location.hash.slice(1).split('/');const k=Number(n);drawDeck(byId.has(id)?id:catalog[0].id,Number.isSafeInteger(k)&&k>0?k-1:0)}
study.onchange=()=>{toggle(false);drawDeck(study.value)};wording.onchange=()=>{toggle(false);drawDeck(wording.value==='loves'?loves:touch,pos)};
$('group').onchange=e=>jump(Number(e.target.value));$('mobileGroup').onchange=e=>jump(Number(e.target.value));$('overview').onclick=()=>toggle(!overview);
$('forward').onclick=()=>jump(pos+1);$('back').onclick=()=>jump(pos-1);
document.addEventListener('keydown',e=>{if(e.altKey||e.metaKey||e.ctrlKey||e.shiftKey||e.target.closest('select,input,textarea'))return;
 if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();jump(pos+(e.key==='ArrowRight'?1:-1))}
 if(e.key==='Escape'&&overview){toggle(false);$('overview').focus()}});
new ResizeObserver(()=>document.documentElement.style.setProperty('--head-height',$('head').offsetHeight+'px')).observe($('head'));
window.addEventListener('hashchange',openHash);openHash();
</script></body></html>
